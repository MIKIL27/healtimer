<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f6f4">
  <title>{% block title %}HealTimer{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6f4;
      --surface: #ffffff;
      --surface-soft: #eaf1ed;
      --text: #1d2925;
      --muted: #68766f;
      --line: #e1e8e3;
      --brand: #26775a;
      --brand-soft: #e0f1e8;
      --stage-1: #e45b63;
      --stage-2: #e4a336;
      --stage-3: #43a879;
      --neon-mild: #12a150;
      --neon-moderate: #d9a400;
      --neon-severe: #f06a00;
      --neon-emergency: #e0203f;
      --neon-maximum: #9a2fe0;
      --allowed-bg: #dff3e8;
      --allowed-text: #176b44;
      --limited-bg: #fff0cf;
      --limited-text: #895800;
      --prohibited-bg: #fde1e2;
      --prohibited-text: #a22d35;
      --shadow: 0 8px 24px rgba(35, 64, 49, .07);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, a, input { font: inherit; }
    .topbar {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { color: var(--brand); font-size: 18px; font-weight: 800; letter-spacing: -.04em; }
    .demo-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .demo-tools form { margin: 0; }
    .demo-button {
      min-height: 44px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-badge {
      padding: 6px 9px;
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }
    main { max-width: 720px; margin: 0 auto; padding: 14px 20px 26px; }
    h1 { margin: 4px 0 8px; font-size: clamp(30px, 8vw, 40px); line-height: 1.08; letter-spacing: -.055em; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    h3 { margin: 0 0 7px; font-size: 14px; color: var(--muted); }
    p { line-height: 1.5; }
    .eyebrow { margin: 0 0 7px; color: var(--brand); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
    .subtitle { margin: 0 0 22px; color: var(--muted); }
    .card {
      padding: 18px;
      margin: 12px 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .info-card p { margin: 0; }
    .section-heading { margin: 24px 0 10px; }
    .category-card { padding: 17px; }
    .category-card h2 { margin-bottom: 12px; }
    .case-links { display: grid; gap: 8px; }
    .case-link, .injury-card { display: block; }
    .case-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 13px 14px;
      border-radius: 13px;
      background: var(--bg);
      font-weight: 700;
    }
    .case-link > .case-name { flex: 1 1 auto; min-width: 0; }
    .severity-label { flex-shrink: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .severity-legend { margin: 16px 0 22px; }
    .severity-legend-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .severity-legend-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }
    .severity-legend-note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .severity-legend-pill,
    .severity-badge {
      --neon: #8a948f;
      border: 2px solid var(--neon);
      box-shadow: 0 0 6px var(--neon), inset 0 0 3px var(--neon);
    }
    .severity-legend-pill.sev-mild, .severity-badge.sev-mild { --neon: #12a150; }
    .severity-legend-pill.sev-moderate, .severity-badge.sev-moderate { --neon: #d9a400; }
    .severity-legend-pill.sev-severe, .severity-badge.sev-severe { --neon: #f06a00; }
    .severity-legend-pill.sev-emergency, .severity-badge.sev-emergency { --neon: #e0203f; }
    .severity-legend-pill.sev-maximum, .severity-badge.sev-maximum { --neon: #9a2fe0; }
    .case-links a.case-link.sev-mild { --neon: #12a150; }
    .case-links a.case-link.sev-moderate { --neon: #d9a400; }
    .case-links a.case-link.sev-severe { --neon: #f06a00; }
    .case-links a.case-link.sev-emergency { --neon: #e0203f; }
    .case-links a.case-link.sev-maximum { --neon: #9a2fe0; }
    .case-links a.case-link {
      border: 2px solid var(--neon, var(--line));
      box-shadow: 0 0 6px var(--neon, transparent), inset 0 0 3px var(--neon, transparent);
    }
    .severity-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }

    /* Buttons */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      margin: 14px 0 0;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      text-align: center;
      cursor: pointer;
    }
    .button-secondary { background: var(--brand-soft); color: var(--brand); }
    .button-danger { background: var(--prohibited-bg); color: var(--prohibited-text); }
    .button-form { margin: 0; }

    /* Home */
    .injury-card { color: inherit; }
    .injury-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .injury-card-top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .arrow { color: var(--muted); font-size: 30px; line-height: 1; }
    .home-progress-track { height: 10px; margin-top: 14px; border-radius: 999px; background: var(--surface-soft); overflow: hidden; }
    .home-progress-fill { height: 100%; border-radius: 999px; background: var(--stage-1); }
    .home-progress-fill.stage-1 { background: var(--stage-1); }
    .home-progress-fill.stage-2 { background: var(--stage-2); }
    .home-progress-fill.stage-3 { background: var(--stage-3); }
    .empty-state { padding: 30px 20px; text-align: center; }
    .empty-state p { margin: 8px 0 4px; color: var(--muted); }
    .empty-icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 28px;
      font-weight: 700;
    }

    /* Injury page */
    .stage-accent { width: 56px; height: 6px; margin: 0 0 12px; border-radius: 999px; background: var(--line); }
    .stage-accent.stage-1 { background: var(--stage-1); }
    .stage-accent.stage-2 { background: var(--stage-2); }
    .stage-accent.stage-3 { background: var(--stage-3); }
    .pain-dots { display: flex; gap: 6px; margin: 0 0 9px; }
    .pain-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
    .pain-dot.filled { background: var(--stage-1); }
    .warning-card { background: var(--warn-bg); border-color: var(--warn-line); }
    .warning-card h3 { color: var(--prohibited-text); }
    .emergency-banner {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--neon-emergency);
      color: #fff;
      font-weight: 750;
      line-height: 1.4;
    }
    .healing-card strong { display: block; font-size: 18px; letter-spacing: -.02em; }
    .healing-card p { margin: 6px 0 0; color: var(--muted); }
    .subsection { padding: 12px 0; border-top: 1px solid var(--line); }
    .subsection:first-of-type { padding-top: 0; border-top: 0; }
    .subsection h4 { margin: 0 0 5px; font-size: 15px; }
    .subsection p { margin: 0; color: var(--muted); font-size: 14px; }
    .countdown-card { border-left: 6px solid var(--line); }
    .countdown-card.stage-1 { border-left-color: var(--stage-1); }
    .countdown-card.stage-2 { border-left-color: var(--stage-2); }
    .countdown-card.stage-3 { border-left-color: var(--stage-3); }
    .countdown-label { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .countdown-number { margin: 4px 0; font-size: clamp(28px, 8vw, 36px); font-weight: 800; letter-spacing: -.045em; line-height: 1.1; }
    .countdown-meta { margin: 0; color: var(--muted); font-size: 14px; }
    .timeline { position: relative; display: flex; gap: 4px; height: 12px; margin: 22px 0 8px; }
    .timeline-segment { flex: 1; border-radius: 999px; }
    .timeline-segment:nth-child(1) { background: var(--stage-1); }
    .timeline-segment:nth-child(2) { background: var(--stage-2); }
    .timeline-segment:nth-child(3) { background: var(--stage-3); }
    .today-marker {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 22px;
      margin-left: -2px;
      border-radius: 2px;
      background: var(--text);
      box-shadow: 0 0 0 2px var(--surface);
    }
    .timeline-legend { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .stage-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
    .stage-dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
    .stage-dot.stage-1 { background: var(--stage-1); }
    .stage-dot.stage-2 { background: var(--stage-2); }
    .stage-dot.stage-3 { background: var(--stage-3); }
    .activity-table { width: 100%; border-collapse: collapse; }
    .activity-table th { padding: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 700; text-align: left; }
    .activity-table td { padding: 11px 0; border-top: 1px solid var(--line); font-weight: 650; }
    .activity-table td:last-child, .activity-table th:last-child { text-align: right; }
    .status-chip { display: inline-block; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 750; }
    .status-allowed { background: var(--allowed-bg); color: var(--allowed-text); }
    .status-limited { background: var(--limited-bg); color: var(--limited-text); }
    .status-prohibited { background: var(--prohibited-bg); color: var(--prohibited-text); }
    .passed-note { margin: 14px 0; padding: 14px 16px; border-radius: 13px; background: var(--limited-bg); color: var(--limited-text); font-weight: 650; }

    /* Bottom navigation (the body reserves 92px for it) */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 20px calc(8px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--line);
    }
    .tabbar a {
      flex: 1;
      max-width: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 14px;
      color: var(--muted);
      font-weight: 750;
    }
    .tabbar a[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    :root { --warn-bg: #fff7f7; --warn-line: #f1cfd1; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111815; --surface: #1a2420; --surface-soft: #22302a;
        --text: #e8efeb; --muted: #9fb0a7; --line: #2b3a33;
        --brand: #5fc39b; --brand-soft: #1f3a2f;
        --allowed-bg: #173626; --allowed-text: #7fdcae;
        --limited-bg: #3b2f10; --limited-text: #f0c66a;
        --prohibited-bg: #3d1a1d; --prohibited-text: #f19aa0;
        --warn-bg: #261719; --warn-line: #4a2a2e;
        --shadow: 0 8px 24px rgba(0, 0, 0, .35);
      }
      .button { color: #0f1a15; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">HealTimer</a>
    <div class="demo-tools" aria-label="Demo time controls">
      {% if demo_offset|default(0) %}<span class="demo-badge">Demo: +{{ demo_offset }} days</span>{% endif %}
      <form method="post" action="{{ url_for('demo', action='plus1') }}"><button class="demo-button" type="submit">+1 day</button></form>
      <form method="post" action="{{ url_for('demo', action='plus7') }}"><button class="demo-button" type="submit">+7 days</button></form>
      {% if demo_offset|default(0) %}<form method="post" action="{{ url_for('demo', action='reset') }}"><button class="demo-button" type="submit">Reset</button></form>{% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ url_for('catalogue') }}"{% if request.endpoint in ('catalogue', 'case_page') %} aria-current="page"{% endif %}>Catalogue</a>
  </nav>
</body>
</html>
