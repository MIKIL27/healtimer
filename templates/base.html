<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f6f8">
  <title>{% block title %}HealTimer{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f6f8;
      --surface: #fff;
      --surface-muted: #eef0f4;
      --text: #18202b;
      --muted: #697386;
      --line: rgba(28, 39, 55, .10);
      --shadow: 0 8px 28px rgba(31, 43, 60, .08);
      --nav-shadow: 0 -5px 24px rgba(31, 43, 60, .08);
      --allowed: #17834e;
      --allowed-bg: #e3f5eb;
      --limited: #a96300;
      --limited-bg: #fff1d7;
      --prohibited: #bd3434;
      --prohibited-bg: #fde8e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage-1 { --accent: #d84a4a; --accent-soft: #fde9e7; }
    .stage-2 { --accent: #e17a32; --accent-soft: #fff0e3; }
    .stage-3 { --accent: #bd941c; --accent-soft: #fff7d9; }
    .stage-4 { --accent: #24935e; --accent-soft: #e4f5eb; }

    .app-header {
      padding: calc(env(safe-area-inset-top) + 12px) 20px 16px;
      background: var(--surface);
      border-bottom: 3px solid var(--accent, #e17a32);
    }

    .header-inner, main, .bottom-nav-inner {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-decoration: none;
    }

    .demo-panel {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      flex-wrap: wrap;
    }

    .demo-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-right: 2px;
    }

    .demo-panel button {
      min-height: 36px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .demo-panel button:active,
    .button:active,
    .category-link:active {
      transform: scale(.98);
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      margin-top: 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    main {
      padding: 26px 18px calc(110px + env(safe-area-inset-bottom));
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(30px, 8vw, 38px);
      letter-spacing: -.045em;
      line-height: 1.08;
    }

    h2 {
      font-size: 21px;
      letter-spacing: -.025em;
    }

    h3 { font-size: 17px; }
    p { line-height: 1.5; }

    .subtitle, .muted, .eyebrow { color: var(--muted); }
    .subtitle { margin-bottom: 24px; }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .card {
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .injury-card {
      display: block;
      color: inherit;
      text-decoration: none;
      border-left: 4px solid var(--accent);
    }

    .injury-card:active { transform: scale(.99); }

    .card-heading, .row-between {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-heading h2 { margin-bottom: 5px; }

    .severity {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stage-pill {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
    }

    .progress-wrap { margin-top: 16px; }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      position: relative;
      height: 10px;
      overflow: visible;
      border-radius: 99px;
      background: var(--surface-muted);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .2s ease;
    }

    .range-marker {
      position: absolute;
      z-index: 1;
      top: -4px;
      width: 2px;
      height: 18px;
      background: var(--text);
      opacity: .68;
    }

    .range-legend {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 17px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, opacity .16s ease;
    }

    .button-primary {
      background: var(--accent, #e17a32);
      color: #fff;
    }

    .button-secondary {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .button-danger {
      background: var(--prohibited-bg);
      color: var(--prohibited);
    }

    .full-width { width: 100%; }

    .category-list, .injury-list {
      display: grid;
      gap: 12px;
    }

    .category-link {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 750;
      transition: transform .16s ease;
    }

    .category-link span:last-child {
      color: var(--muted);
      font-size: 22px;
    }

    .list-link {
      display: block;
      padding: 17px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
    }

    .list-link h2 { margin-bottom: 6px; }
    .list-link p { margin-bottom: 0; color: var(--muted); }

    .empty-state {
      padding: 30px 20px;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .empty-state .button { margin-top: 10px; }

    .notice {
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--accent-soft);
    }

    .notice p { margin-bottom: 12px; }
    .notice h2 { margin-bottom: 8px; font-size: 18px; }

    .flash-list { margin-bottom: 16px; }

    .flash {
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .flash-error { border-left: 4px solid var(--prohibited); }
    .flash-success { border-left: 4px solid var(--allowed); }

    .severity-options {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .severity-option {
      display: flex;
      min-height: 54px;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      font-weight: 700;
      cursor: pointer;
    }

    .severity-option:has(input:checked) {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    input[type="radio"] {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent, #e17a32);
    }

    input, button { font-size: 16px; }

    .estimate-box {
      padding: 18px;
      margin: 18px 0;
      border-radius: 16px;
      background: var(--accent-soft);
    }

    .estimate-number {
      margin: 0;
      font-size: 30px;
      font-weight: 850;
      letter-spacing: -.04em;
    }

    .estimate-box p:last-child { margin-bottom: 0; }

    .timeline {
      position: relative;
      display: flex;
      height: 18px;
      margin: 28px 0 12px;
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .timeline-segment:first-child { border-radius: 999px 0 0 999px; }
    .timeline-segment:last-of-type { border-radius: 0 999px 999px 0; }
    .timeline-segment:nth-child(1) { background: #d84a4a; }
    .timeline-segment:nth-child(2) { background: #e17a32; }
    .timeline-segment:nth-child(3) { background: #d6ad2c; }
    .timeline-segment:nth-child(4) { background: #24935e; }

    .today-marker {
      position: absolute;
      top: -7px;
      width: 4px;
      height: 32px;
      border: 1px solid var(--surface);
      border-radius: 4px;
      background: var(--text);
      transform: translateX(-50%);
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .activity-table {
      width: 100%;
      border-collapse: collapse;
    }
